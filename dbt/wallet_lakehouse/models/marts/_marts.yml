version: 2

models:
  - name: dim_users
    description: >
      One row per user — the CURRENT version only. Grain: one row per
      user_id. Backed by the users_snapshot Type-2 SCD (dbt snapshot), but
      exposed here as a plain current-state dimension for joins that don't
      need history. See dim_users_history for the full change log.
    columns:
      - name: user_id
        tests: [unique, not_null]

  - name: dim_users_history
    description: >
      Full Type-2 change history per user: one row per (user_id,
      valid_from). Built on snapshots/users_snapshot.sql (timestamp
      strategy on the CDC updated_at column). Use for point-in-time joins
      — see the model docstring for the pattern.
    columns:
      - name: user_id
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: dim_wallets
    description: "One row per wallet. Grain: one row per wallet_id."
    columns:
      - name: wallet_id
        tests: [unique, not_null]
      - name: user_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id

  - name: fact_transactions
    description: >
      One row per transaction. Grain: one row per transaction_id — the
      finest grain the source system emits; no fan-out from joins to
      dim_wallets/dim_users (both are 1-to-1 with the transaction's
      wallet_id/user_id at query time).
    columns:
      - name: transaction_id
        tests: [unique, not_null]
      - name: wallet_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_wallets')
                field: wallet_id
      - name: usd_value_at_tx
        description: >
          Non-negative check enforced by the singular test
          tests/assert_transaction_usd_value_non_negative.sql (kept
          dependency-free — swap for dbt_utils.accepted_range once the
          dbt_utils package is installed, see packages.yml).
