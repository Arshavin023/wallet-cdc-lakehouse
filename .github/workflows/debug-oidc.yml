name: Debug OIDC claims (temporary)

# One-off diagnostic — NOT part of the real pipeline. Decodes the actual
# OIDC token GitHub issues for this repo and prints its claims (aud, sub,
# iss) so we can compare them character-for-character against what the
# AWS IAM role's trust policy expects, instead of guessing. Delete this
# file once the mismatch (if any) is found and fixed.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Request and decode OIDC token
        run: |
          IDTOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "===== decoded payload ====="
          echo "$IDTOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, ref, event_name}'
